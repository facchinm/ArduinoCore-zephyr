# MicroPython running in a thread next to the sketch (see -DLOADER_MICROPYTHON=y)
CONFIG_LOADER_MICROPYTHON=y
CONFIG_MICROPY_CONFIGFILE="mpconfigport.h"
CONFIG_MICROPY_HEAP_SIZE=65536
CONFIG_MICROPY_THREAD_STACK_SIZE=8192
# Same priority as the sketch: with time slicing neither can starve the other
CONFIG_MICROPY_THREAD_PRIORITY=14

# No frozen _boot.py: it would format the storage partition shared with sketches
CONFIG_MICROPY_FROZEN_MODULES=n

CONFIG_POLL=y
# Look devices up by devicetree node label, e.g. ADC(("adc1", 9))
CONFIG_DEVICE_DT_METADATA=y
