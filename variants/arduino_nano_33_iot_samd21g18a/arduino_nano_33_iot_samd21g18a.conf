# SAMD21G18A has only 32 KB of SRAM, shrink the loader defaults
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# Heap handed to statically linked sketches (KB)
CONFIG_LLEXT_HEAP_SIZE=8

CONFIG_RTC=n
CONFIG_RTC_ALARM=n
CONFIG_RTC_UPDATE=n
CONFIG_RTC_CALIBRATION=n

CONFIG_ADC=y
CONFIG_PWM=y

CONFIG_USERSPACE=n
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n

# Keep the loader inside the code partition
CONFIG_USE_DT_CODE_PARTITION=y

# Needed by the Serial implementation
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_PRODUCT="Arduino Nano 33 IoT"
CONFIG_USB_DEVICE_MANUFACTURER="Arduino"
CONFIG_USB_DEVICE_VID=0x2341
CONFIG_USB_DEVICE_PID=0x8057

CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_DTE_RATE_CALLBACK_SUPPORT=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_ERR=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UART_LINE_CTRL=y

CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=n

# Dynamic (LLEXT) sketches don't fit: static link mode only
CONFIG_LOADER_STATIC_ONLY=y
