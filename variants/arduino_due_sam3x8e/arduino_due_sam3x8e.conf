# SAM3X8E has only 96 KB of SRAM, shrink the loader defaults
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096

# Heap handed to statically linked sketches (KB)
CONFIG_LLEXT_HEAP_SIZE=16

# No Zephyr flash driver for SAM3X: the sketch is read from memory-mapped flash
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n

# No driver support in Zephyr for the SAM3X RTC
CONFIG_RTC=n
CONFIG_RTC_ALARM=n
CONFIG_RTC_UPDATE=n
CONFIG_RTC_CALIBRATION=n

CONFIG_ADC=n
CONFIG_PWM=y
CONFIG_COUNTER=y

CONFIG_NULL_POINTER_EXCEPTION_DETECTION_DWT=n

# Keep the loader inside the code partition
CONFIG_USE_DT_CODE_PARTITION=y

# Needed by the Serial implementation
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USB_DEVICE_PRODUCT="Arduino Due"
CONFIG_USB_DEVICE_MANUFACTURER="Arduino"
CONFIG_USB_DEVICE_VID=0x2341
CONFIG_USB_DEVICE_PID=0x003e

CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Arduino Due"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Arduino"
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_DTE_RATE_CALLBACK_SUPPORT=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_ERR=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UART_LINE_CTRL=y

CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=n
