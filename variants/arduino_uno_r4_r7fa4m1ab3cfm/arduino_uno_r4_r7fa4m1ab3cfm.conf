# RA4M1 has only 32 KB of SRAM, shrink the loader defaults
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# Heap handed to statically linked sketches (KB)
CONFIG_LLEXT_HEAP_SIZE=16

# Dynamic (LLEXT) sketches don't fit: static link mode only
CONFIG_LOADER_STATIC_ONLY=y

# The sketch is read from memory-mapped flash
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n

CONFIG_RTC=n
CONFIG_RTC_ALARM=n
CONFIG_RTC_UPDATE=n
CONFIG_RTC_CALIBRATION=n

CONFIG_FPU=y
CONFIG_ADC=y
CONFIG_PWM=y

CONFIG_USERSPACE=n
CONFIG_HW_STACK_PROTECTION=n

# Keep the loader inside the code partition
CONFIG_USE_DT_CODE_PARTITION=y

# Needed by the Serial implementation
CONFIG_UART_INTERRUPT_DRIVEN=y
